<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Type Fight</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Battle Card Arena</p>
        <h1>Type Fight</h1>
      </div>
      <div class="coin-panel">
        <span>Coins</span>
        <strong id="coinCount">120</strong>
      </div>
    </header>

    <main class="main-layout">
      <aside class="panel roster-panel">
        <div class="panel-header">
          <h2>Roster</h2>
        </div>
        <div id="rosterList" class="fighter-list"></div>
      </aside>

      <section class="panel battle-panel">
        <div class="battle-topbar">
          <h2>Battle Arena</h2>
          <button id="newBattleBtn" class="primary-btn">New Battle</button>
        </div>

        <div class="summon-stage">
          <div class="arena-side player-side">
            <div class="fighter-nameplate" id="playerNamePlate">Freddy Fazbear</div>
            <div class="fighter-portrait-wrapper">
              <div class="fighter-portrait player-portrait" id="playerPortrait"></div>
            </div>
            <div class="health-wrap">
              <div class="health-bar">
                <div id="playerHealthFill" class="health-fill player-fill"></div>
              </div>
              <span id="playerHealthText">105 / 105</span>
            </div>
          </div>

          <div class="vs-badge">VS</div>

          <div class="arena-side enemy-side">
            <div class="fighter-nameplate" id="enemyNamePlate">Enemy</div>
            <div class="fighter-portrait-wrapper">
              <div class="fighter-portrait enemy-portrait" id="enemyPortrait"></div>
            </div>
            <div class="health-wrap">
              <div class="health-bar">
                <div id="enemyHealthFill" class="health-fill enemy-fill"></div>
              </div>
              <span id="enemyHealthText">0 / 0</span>
            </div>
          </div>
        </div>

        <div class="sentence-panel">
          <p class="section-label">Type to attack</p>
          <div id="sentenceBox" class="sentence-box"></div>
        </div>

        <div class="attack-row">
          <input id="typingInput" type="text" autocomplete="off" spellcheck="false" placeholder="Type the sentence here..." />
          <button id="attackBtn" class="primary-btn">Attack</button>
        </div>

        <div class="combo-row">
          <button class="combo-btn" data-combo="normal">Normal</button>
          <button class="combo-btn" data-combo="combo">Combo</button>
          <button class="combo-btn" data-combo="special">Special</button>
        </div>

        <div id="battleLog" class="battle-log">Pick a fighter and start battling.</div>
      </section>

      <aside class="panel shop-panel">
        <div class="panel-header">
          <h2>Packs</h2>
        </div>
        <div id="packList" class="pack-list"></div>
      </aside>
    </main>

    <section class="panel collection-panel">
      <div class="panel-header collection-header">
        <h2>Collection</h2>
      </div>
      <div id="collectionList" class="collection-grid"></div>
    </section>
  </div>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
